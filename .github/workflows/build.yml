name: Build
on:
  push:
    paths:
      - '**.4dm'
  pull_request:
    paths:
      - '**.4dm'
  workflow_dispatch:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Check out Hero
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Hero
        path: Components/Hero.4dbase
        ref: main
        fetch-depth: 0
    - name: Build
      uses: 4d/build4d-action@main
