<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="4" y="4" width="56" height="56" rx="13" fill="#6C5CE7"/>
  <!-- four memory cards: a letter, its picture, and two face-down -->
  <rect x="13" y="13" width="18" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="33" y="13" width="18" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="13" y="33" width="18" height="18" rx="4" fill="#C7BEF3"/>
  <rect x="33" y="33" width="18" height="18" rx="4" fill="#C7BEF3"/>
  <!-- the letter A -->
  <g stroke="#2B3A55" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 27 L22 17 L26 27"/>
    <path d="M19.4 23.5 H24.6"/>
  </g>
  <!-- its picture (an apple) -->
  <circle cx="42" cy="23" r="5.2" fill="#E0736A"/>
  <rect x="41.2" y="15.5" width="1.6" height="3" rx="0.8" fill="#6FB98F"/>
</svg>
